<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demonic Scheduler</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: #0b0e14;
        color: #cdd6e4;
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #app { position: relative; width: 100%; height: 100%; }
      #app canvas { display: block; }

      .panel {
        position: absolute; top: 16px; left: 16px; width: 480px;
        max-height: calc(100% - 32px); overflow-y: auto;
        background: rgba(13, 17, 26, 0.88);
        border: 1px solid #232c3f; border-radius: 8px;
        padding: 14px 16px; backdrop-filter: blur(4px);
      }
      .panel h1 { margin: 0 0 6px; font-size: 15px; color: #f2f6ff; font-weight: 600; }
      .panel .desc { margin: 0 0 10px; color: #8d99ad; }
      .panel .moves { color: #ffb04d; margin: 10px 0 0; }
      .panel .status { color: #8d99ad; margin: 8px 0 0; }
      .panel .status b { color: #ffb04d; }

      .levels { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
      .levels .lvl {
        min-width: 30px; padding: 3px 0; text-align: center;
        border-radius: 5px; font-size: 12px;
      }
      .levels .lvl.active { border-color: #7a88ff; color: #f2f6ff; }
      .levels .lvl:disabled { opacity: 0.35; cursor: default; }

      .tutorial {
        margin: 0 0 8px; padding: 8px 10px;
        background: rgba(122, 136, 255, 0.07);
        border-left: 3px solid #7a88ff; border-radius: 0 6px 6px 0;
        color: #aab6d8;
      }
      .goal { margin: 0 0 10px; color: #6ec8ff; font-weight: 600; }

      .editor-mount { margin-top: 10px; }
      .editor-mount:empty { display: none; }
      .formula { color: #d9a441; }

      .spec { border-top: 1px solid #232c3f; padding-top: 10px; }
      .spec .kw { color: #7a88ff; font-weight: 600; }
      .spec .vars { margin: 4px 0 10px; padding-left: 14px; }
      .spec .var { display: inline-block; margin-right: 14px; color: #8d99ad; }
      .spec .var b { color: #cdd6e4; font-weight: 600; }
      .spec .var.changed b { color: #ffb04d; }
      .spec .action {
        padding: 2px 6px 2px 2.4em; margin: 1px -6px; border-radius: 5px;
        color: #55607a; text-indent: -2.05em; transition: background 0.12s;
      }
      .spec .action .kw { color: #55607a; }
      .spec .action.enabled { color: #cdd6e4; cursor: pointer; }
      .spec .action.enabled .kw { color: #7a88ff; }
      .spec .action.enabled .aname { color: #ffb04d; font-weight: 600; }
      .spec .action.enabled .guard { color: #8fd0a0; }
      .spec .action.enabled:hover, .spec .action.hovered { background: #1d2740; }
      .spec .action.failing { background: rgba(255, 59, 82, 0.1); color: #cdd6e4; }
      .spec .action.failing .aname { color: #ff3b52; font-weight: 600; }
      .spec .inv { margin-top: 10px; color: #8d99ad; }
      .spec .inv.violated .src { color: #ff3b52; font-weight: 600; }

      .bricks { margin-top: 10px; border-top: 1px solid #232c3f; padding-top: 8px; }
      .bricks .kw { color: #7a88ff; font-weight: 600; }
      .brick { margin: 4px 0 4px 8px; color: #cdd6e4; }
      .brick .box { color: #3fae6a; font-weight: 700; }
      .brick .src { color: #d9a441; }
      .brick .tag {
        margin-left: 8px; padding: 0 6px; border-radius: 4px;
        background: #1d2740; color: #8d99ad; font-size: 11px;
      }
      .brick .deps { margin-left: 18px; color: #55607a; font-size: 12px; }
      .brick .deps .dep { color: #8d99ad; }
      .goal-status { margin-top: 6px; color: #8d99ad; }
      .goal-status.proved { color: #3fae6a; }
      .goal-status.proved b { color: #3fae6a; }

      .inspector {
        position: absolute; z-index: 30; min-width: 190px; max-width: 260px;
        background: rgba(13, 17, 26, 0.95);
        border: 1px solid #3a4a70; border-radius: 8px;
        padding: 10px 12px;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5);
      }
      .inspector .close {
        position: absolute; top: 4px; right: 4px;
        background: none; border: none; color: #55607a; padding: 2px 6px;
      }
      .inspector .close:hover { color: #cdd6e4; background: none; }
      .inspector .row { color: #8d99ad; }
      .inspector .row b { color: #f2f6ff; }
      .inspector .badge {
        display: inline-block; margin: 6px 6px 0 0; padding: 1px 8px;
        border-radius: 4px; font-size: 11px;
      }
      .inspector .badge.ok { background: rgba(63, 174, 106, 0.15); color: #3fae6a; }
      .inspector .badge.ghost { background: rgba(85, 96, 122, 0.25); color: #8d99ad; }
      .inspector .badge.bad { background: rgba(255, 59, 82, 0.15); color: #ff3b52; }
      .inspector .note { margin-top: 6px; color: #ffb04d; font-size: 11px; }

      .tour-bubble {
        position: fixed; z-index: 200; width: 340px;
        background: #141b2c; border: 1px solid #6ec8ff; border-radius: 10px;
        padding: 12px 14px; color: #cdd6e4;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      .tour-bubble code { color: #ffb04d; }
      .tour-bubble b { color: #f2f6ff; }
      .tour-controls {
        display: flex; align-items: center; gap: 10px; margin-top: 10px;
      }
      .tour-count { color: #55607a; }
      .tour-wait { color: #6ec8ff; }
      .tour-skip {
        margin-left: auto; background: none; border: none;
        color: #55607a; text-decoration: underline; padding: 0;
      }
      .tour-target {
        position: relative; z-index: 150; border-radius: 8px;
        box-shadow: 0 0 0 3px #6ec8ff, 0 0 0 200vmax rgba(5, 7, 11, 0.72);
      }

      .panel .hint { margin-top: 8px; color: #6ec8ff; min-height: 1.5em; }
      .panel .trace { margin-top: 8px; color: #d9a441; word-break: break-word; }
      .panel .trace .arrow { color: #55607a; margin: 0 4px; }
      .panel .buttons { margin-top: 12px; display: flex; gap: 8px; }
      button {
        background: #1a2233; color: #cdd6e4;
        border: 1px solid #2c3a55; border-radius: 6px;
        padding: 5px 12px; font: inherit; cursor: pointer;
      }
      button:hover { background: #243049; }

      .tooltip {
        position: absolute; pointer-events: none;
        background: #1a2233; border: 1px solid #2c3a55; border-radius: 6px;
        padding: 3px 9px; color: #ffb04d; white-space: nowrap; z-index: 10;
      }

      .victory {
        position: absolute; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(11, 14, 20, 0.72); z-index: 20;
      }
      .victory .card {
        background: #12182a; border: 1px solid #3a2430; border-radius: 10px;
        padding: 24px 32px; text-align: center; max-width: 480px;
        box-shadow: 0 0 60px rgba(255, 59, 82, 0.25);
      }
      .victory h2 { margin: 0 0 12px; color: #ff3b52; font-size: 18px; }
      .victory p { margin: 6px 0; }
      .victory button { margin-top: 14px; }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
