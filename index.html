<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demonic Scheduler</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: #0b0e14;
        color: #cdd6e4;
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #app { position: relative; width: 100%; height: 100%; }
      #app canvas { display: block; }

      .panel {
        position: absolute; top: 16px; left: 16px; width: 320px;
        background: rgba(13, 17, 26, 0.85);
        border: 1px solid #232c3f; border-radius: 8px;
        padding: 14px 16px; backdrop-filter: blur(4px);
      }
      .panel h1 { margin: 0 0 6px; font-size: 15px; color: #f2f6ff; font-weight: 600; }
      .panel .desc { margin: 0 0 10px; color: #8d99ad; }
      .panel .moves { color: #ffb04d; margin-bottom: 8px; }
      .panel .state .var { margin-right: 8px; color: #8d99ad; }
      .panel .state b { color: #cdd6e4; font-weight: 600; }
      .panel .hint { margin-top: 8px; color: #6ec8ff; min-height: 1.5em; }
      .panel .trace { margin-top: 8px; color: #d9a441; word-break: break-word; }
      .panel .trace .arrow { color: #55607a; margin: 0 4px; }
      .panel .buttons { margin-top: 12px; display: flex; gap: 8px; }
      button {
        background: #1a2233; color: #cdd6e4;
        border: 1px solid #2c3a55; border-radius: 6px;
        padding: 5px 12px; font: inherit; cursor: pointer;
      }
      button:hover { background: #243049; }

      .tooltip {
        position: absolute; pointer-events: none;
        background: #1a2233; border: 1px solid #2c3a55; border-radius: 6px;
        padding: 3px 9px; color: #ffb04d; white-space: nowrap; z-index: 10;
      }

      .victory {
        position: absolute; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(11, 14, 20, 0.72); z-index: 20;
      }
      .victory .card {
        background: #12182a; border: 1px solid #3a2430; border-radius: 10px;
        padding: 24px 32px; text-align: center; max-width: 480px;
        box-shadow: 0 0 60px rgba(255, 59, 82, 0.25);
      }
      .victory h2 { margin: 0 0 12px; color: #ff3b52; font-size: 18px; }
      .victory p { margin: 6px 0; }
      .victory button { margin-top: 14px; }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
