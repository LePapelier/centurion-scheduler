<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demonic Scheduler</title>
    <style>
      /* Palette : identité visuelle du portfolio (voir src/render/palette.ts). */
      :root {
        --bg: #070b14;
        --panel: rgba(9, 14, 26, 0.88);
        --border: #1e2a44;
        --text: #f7faff;
        --body: #c3cde0;
        --muted: #b6c2d9;
        --dim: #5d6b85;
        --cyan: #55e8f6;
        --blue: #78b8ff;
        --gold: #ffd166;
        --orange: #ffb347;
        --green: #81c995;
        --pink: #ff6b9d;
        --lavender: #aa96da;
        --hover: #14203a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--body);
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #app { position: relative; width: 100%; height: 100%; }
      #app canvas { display: block; }

      .panel {
        position: absolute; top: 16px; left: 16px; width: 480px;
        max-height: calc(100% - 32px); overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 14px 16px; backdrop-filter: blur(4px);
      }
      .panel h1 { margin: 0 0 6px; font-size: 15px; color: var(--text); font-weight: 600; }
      .panel .desc { margin: 0 0 10px; color: var(--muted); }
      .panel .moves { color: var(--orange); margin: 10px 0 0; }
      .panel .status { color: var(--muted); margin: 8px 0 0; }
      .panel .status b { color: var(--orange); }
      .status .err { color: var(--pink); }

      .levels { display: flex; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
      .levels .chapter {
        color: var(--dim); font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.08em; margin: 0 3px 0 6px;
      }
      .levels .chapter:first-child { margin-left: 0; }
      .levels .lvl {
        min-width: 30px; padding: 3px 0; text-align: center;
        border-radius: 5px; font-size: 12px;
      }
      .levels .lvl.active { border-color: var(--cyan); color: var(--text); }
      .levels .lvl:disabled { opacity: 0.35; cursor: default; }

      .tutorial {
        margin: 0 0 8px; padding: 8px 10px;
        background: rgba(85, 232, 246, 0.06);
        border-left: 3px solid var(--cyan); border-radius: 0 6px 6px 0;
        color: var(--muted);
      }
      .goal { margin: 0 0 10px; color: var(--blue); font-weight: 600; }

      .commandbar {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        width: min(720px, 94vw);
        background: var(--panel);
        border: 1px solid var(--border); border-radius: 10px;
        padding: 10px 14px; backdrop-filter: blur(4px);
      }
      .commandbar .bricks-list { max-height: 132px; overflow-y: auto; }
      .commandbar .varsbar { justify-content: center; margin-bottom: 6px; }
      .commandbar .varsbar:empty { display: none; }
      .panel .moves-top { color: var(--orange); margin-top: 8px; }
      .panel .moves-top:empty { display: none; }
      .commandbar .deadlock {
        margin: 6px 0; padding: 6px 10px; text-align: center;
        color: var(--pink); border: 1px solid rgba(255, 107, 157, 0.55);
        border-radius: 6px; background: rgba(255, 107, 157, 0.08);
        animation: deadlock-pulse 1.6s ease-in-out infinite;
      }
      .commandbar .deadlock b { color: var(--text); }
      @keyframes deadlock-pulse {
        0%, 100% { box-shadow: 0 0 0 rgba(255, 107, 157, 0); }
        50% { box-shadow: 0 0 18px rgba(255, 107, 157, 0.35); }
      }
      .commandbar .actionbar {
        display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .commandbar .actionbar:empty { display: none; }
      .commandbar .actionbar .chip { padding: 6px 18px; font-size: 14px; }
      .commandbar .editor-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
      .commandbar .editor-mount { flex: 1; margin: 0; }
      .commandbar .buttons { display: flex; gap: 6px; margin: 0; }
      .commandbar .moves { margin: 0; }
      .commandbar .status { margin: 2px 0 0; }
      .commandbar .hint { margin: 2px 0 0; min-height: 0; }
      .commandbar .hint:empty { display: none; }
      .commandbar .trace { margin: 2px 0 0; }
      .commandbar .trace:empty { display: none; }
      .commandbar .moves:empty { display: none; }
      .commandbar .status:empty { display: none; }
      .commandbar .goal-status { margin: 2px 0 4px; }

      .editor-mount { margin-top: 10px; }
      .editor-mount:empty { display: none; }
      .formula { color: var(--gold); }

      /* Coloration par token (cohérente avec l'éditeur). */
      .hl-var { color: #78b8ff; }
      .hl-num { color: #f7dc6f; }
      .hl-str { color: #81c995; }
      .hl-op { color: #aa96da; }
      .hl-punct { color: var(--muted); }

      .spec { border-top: 1px solid var(--border); padding-top: 10px; }
      .spec .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .chip {
        display: inline-flex; align-items: center; gap: 3px;
        padding: 2px 9px; border-radius: 999px; font: inherit;
        background: #0d1526; border: 1px solid var(--border); color: var(--muted);
      }
      .chip.var { gap: 1px; }
      .chip.var.changed { animation: chip-tick 0.45s ease-out; }
      @keyframes chip-tick {
        0% { transform: scale(1.18); border-color: var(--orange); box-shadow: 0 0 12px rgba(255, 179, 71, 0.5); }
        100% { transform: none; }
      }
      .chip.action { opacity: 0.38; cursor: default; transition: opacity 0.15s, border-color 0.15s; }
      .chip.action.enabled {
        opacity: 1; cursor: pointer; color: var(--orange);
        border-color: rgba(255, 179, 71, 0.55); box-shadow: 0 0 10px rgba(255, 179, 71, 0.14);
      }
      .chip.action.enabled:hover { background: var(--hover); }
      .chip.action.failing {
        opacity: 1; color: var(--pink);
        border-color: rgba(255, 107, 157, 0.6); box-shadow: 0 0 10px rgba(255, 107, 157, 0.2);
      }
      .chip.action.played { animation: chip-tick 0.45s ease-out; }
      .chip.atom {
        cursor: pointer; color: var(--cyan);
        border-color: rgba(85, 232, 246, 0.4);
      }
      .chip.atom:hover { background: var(--hover); }

      .rule { margin-top: 10px; padding: 5px 10px; border-radius: 6px; color: var(--muted); border: 1px solid transparent; }
      .rule .rule-tag {
        display: inline-block; margin-right: 8px; padding: 0 7px;
        border-radius: 4px; font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.05em; font-weight: 600;
      }
      .rule.break .rule-tag { color: var(--pink); border: 1px solid rgba(255, 107, 157, 0.5); }
      .rule.prove .rule-tag { color: var(--green); border: 1px solid rgba(129, 201, 149, 0.5); }
      .rule.violated {
        border-color: rgba(255, 107, 157, 0.6);
        background:
          linear-gradient(105deg, transparent 42%, rgba(255, 107, 157, 0.25) 43%, transparent 45%),
          linear-gradient(75deg, transparent 60%, rgba(255, 107, 157, 0.22) 61%, transparent 63%),
          rgba(255, 107, 157, 0.06);
        animation: rule-crack 0.4s ease-out;
      }
      .rule.violated .rule-icon { color: var(--pink); }
      @keyframes rule-crack {
        0%, 60% { transform: translateX(0); }
        10% { transform: translateX(-3px); }
        25% { transform: translateX(3px); }
        40% { transform: translateX(-2px); }
      }

      .popover {
        position: fixed; z-index: 80; max-width: 370px;
        background: rgba(7, 11, 20, 0.97); border: 1px solid var(--border);
        border-radius: 8px; padding: 7px 11px; pointer-events: none;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.55);
      }
      .popover .kw { color: var(--cyan); font-weight: 600; }
      .popover .aname { color: var(--orange); font-weight: 600; }
      .popover .arrow { color: var(--muted); }

      .fly {
        position: fixed; z-index: 60; pointer-events: none; color: var(--gold);
        transition: transform 0.45s cubic-bezier(0.3, 0.7, 0.3, 1), opacity 0.45s;
      }

      .bricks { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
      .bricks .kw { color: var(--cyan); font-weight: 600; }
      .brick { margin: 4px 0 4px 8px; color: var(--body); }
      .bricks-list .brick:last-child { animation: brick-in 0.3s ease-out; }
      @keyframes brick-in {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: none; }
      }
      .brick .bdel {
        margin-left: 6px; padding: 0 5px; border: none; background: none;
        color: var(--dim); font-size: 11px;
      }
      .brick .bdel:hover { color: var(--pink); background: none; }
      .brick .box { color: var(--green); font-weight: 700; }
      .brick .bname { color: var(--cyan); font-weight: 600; }
      .brick .src { color: var(--gold); }
      .brick .tag {
        margin-left: 8px; padding: 0 6px; border-radius: 4px;
        background: var(--hover); color: var(--muted); font-size: 11px;
      }
      .brick .deps { margin-left: 18px; color: var(--dim); font-size: 12px; }
      .brick .deps .dep { color: var(--muted); }
      .goal-status { margin-top: 6px; color: var(--muted); }
      .goal-status.proved { color: var(--green); }
      .goal-status.proved b { color: var(--green); }

      .inspector {
        position: absolute; z-index: 30; min-width: 190px; max-width: 260px;
        background: rgba(7, 11, 20, 0.95);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 12px;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5);
      }
      .inspector .close {
        position: absolute; top: 4px; right: 4px;
        background: none; border: none; color: var(--dim); padding: 2px 6px;
      }
      .inspector .close:hover { color: var(--body); background: none; }
      .inspector .row { color: var(--muted); }
      .inspector .row b { color: var(--text); }
      .inspector .badge {
        display: inline-block; margin: 6px 6px 0 0; padding: 1px 8px;
        border-radius: 4px; font-size: 11px;
      }
      .inspector .badge.ok { background: rgba(129, 201, 149, 0.15); color: var(--green); }
      .inspector .badge.ghost { background: rgba(93, 107, 133, 0.25); color: var(--muted); }
      .inspector .badge.bad { background: rgba(255, 107, 157, 0.15); color: var(--pink); }
      .inspector .note { margin-top: 6px; color: var(--gold); font-size: 11px; }

      .panel .hint { margin-top: 8px; color: var(--blue); min-height: 1.5em; }
      .panel .trace { margin-top: 8px; color: var(--gold); word-break: break-word; }
      .panel .trace .arrow { color: var(--dim); margin: 0 4px; }
      .panel .buttons { margin-top: 12px; display: flex; gap: 8px; }
      button {
        background: #101a30; color: var(--body);
        border: 1px solid var(--border); border-radius: 6px;
        padding: 5px 12px; font: inherit; cursor: pointer;
      }
      button:hover { background: var(--hover); border-color: #2c4a6e; }

      .tooltip {
        position: absolute; pointer-events: none;
        background: #101a30; border: 1px solid var(--border); border-radius: 6px;
        padding: 3px 9px; color: var(--orange); white-space: nowrap; z-index: 10;
      }

      .victory {
        position: absolute; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(7, 11, 20, 0.72); z-index: 20;
      }
      .victory .card {
        background: rgba(9, 14, 26, 0.97); border-radius: 10px;
        padding: 24px 32px; text-align: center; max-width: 480px;
        animation: victory-pop 0.28s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      @keyframes victory-pop {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: none; }
      }
      .victory h2 { margin: 0 0 12px; font-size: 18px; }
      /* Casser = triomphe doré ; prouver = sceau vert. */
      .victory.gold .card { border: 1px solid #4a3c1e; box-shadow: 0 0 60px rgba(255, 209, 102, 0.28); }
      .victory.gold h2 { color: var(--gold); }
      .victory.green .card { border: 1px solid #23402e; box-shadow: 0 0 60px rgba(129, 201, 149, 0.26); }
      .victory.green h2 { color: var(--green); }
      .victory p { margin: 6px 0; }
      .victory .record { color: var(--gold); font-size: 12px; }
      .victory button { margin-top: 14px; }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
